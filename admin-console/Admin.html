<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: light;
        --text: #202124;
        --muted: #5f6368;
        --line: #dadce0;
        --accent: #1a73e8;
        --danger: #d93025;
        --success: #137333;
        --surface: #ffffff;
        --page: #f8f9fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
      }

      header {
        padding: 18px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0;
      }

      main {
        padding: 18px 24px 28px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .status {
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .status.success {
        color: var(--success);
      }

      .table-wrap {
        overflow-x: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      table {
        width: 100%;
        min-width: 1560px;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        position: sticky;
        top: 0;
        background: #f1f3f4;
        color: #3c4043;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      input {
        width: 260px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: inherit;
        padding: 7px 8px;
      }

      button {
        min-height: 34px;
        border: 0;
        border-radius: 4px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 0 12px;
        white-space: nowrap;
      }

      button.secondary {
        background: #eef3fd;
        color: #174ea6;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        border-radius: 999px;
        background: #eef3fd;
        color: #174ea6;
        font-size: 12px;
        padding: 2px 8px;
      }

      .pill.warn {
        background: #fef7e0;
        color: #b06000;
      }

      .pill.error {
        background: #fce8e6;
        color: var(--danger);
      }

      .cell-stack {
        display: grid;
        gap: 6px;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
      }

      .row-message {
        max-width: 280px;
        color: var(--muted);
        font-size: 12px;
        white-space: pre-line;
      }

      .status-lines {
        display: grid;
        gap: 3px;
      }

      .status-line.ok {
        color: var(--success);
      }

      .status-line.error {
        color: var(--danger);
      }

      .group-picker {
        display: grid;
        gap: 6px;
        max-width: 360px;
        position: relative;
      }

      .group-picker input {
        width: 320px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        border-radius: 999px;
        background: #e8f0fe;
        color: #174ea6;
        font-size: 12px;
        padding: 2px 8px;
      }

      .chip button {
        min-height: auto;
        background: transparent;
        color: inherit;
        font-size: 14px;
        line-height: 1;
        padding: 0;
      }

      .suggestions {
        display: none;
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(60, 64, 67, 0.25);
        position: absolute;
        top: 38px;
        left: 0;
        width: 360px;
        z-index: 10;
      }

      .suggestion {
        cursor: pointer;
        padding: 8px 10px;
      }

      .suggestion:hover {
        background: #f1f3f4;
      }

      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Gestió de noves incorporacions</h1>
    </header>
    <main>
      <div class="toolbar">
        <div id="status" class="status">Carregant dades...</div>
        <button class="secondary" type="button" onclick="loadRows()">Actualitza</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Professor/a</th>
              <th>DNI</th>
              <th>Detalls</th>
              <th>Correu institucional</th>
              <th>Dinantia</th>
              <th>Fitxers</th>
              <th>Estat</th>
              <th>Acció</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const rowsEl = document.getElementById('rows');
      let dinantiaGroups = [];

      loadRows();

      function loadRows() {
        setStatus('Carregant dades...');
        google.script.run
          .withSuccessHandler((groups) => {
            dinantiaGroups = groups;
            google.script.run
              .withSuccessHandler(renderRows)
              .withFailureHandler((error) => setStatus(error.message || String(error), 'error'))
              .getAdminRows();
          })
          .withFailureHandler((error) => setStatus(error.message || String(error), 'error'))
          .getDinantiaGroups();
      }

      function renderRows(rows) {
        rowsEl.innerHTML = '';
        if (!rows.length) {
          rowsEl.innerHTML = '<tr><td colspan="8">No hi ha dades.</td></tr>';
          setStatus('No hi ha dades.');
          return;
        }

        rows.forEach((row) => rowsEl.appendChild(renderRow(row)));
        setStatus(`${rows.length} files carregades.`);
      }

      function renderRow(row) {
        const tr = document.createElement('tr');
        tr.dataset.rowNumber = row.rowNumber;

        tr.innerHTML = `
          <td>
            <div class="cell-stack">
              <strong>${escapeHtml(row.nom)} ${escapeHtml(row.cognoms)}</strong>
              <span class="muted">${escapeHtml(row.compteXtec || '')}</span>
            </div>
          </td>
          <td>${escapeHtml(row.dni || '')}</td>
          <td>
            <div class="cell-stack">
              <span>${escapeHtml(row.departament || '')}</span>
              <span class="muted">${escapeHtml(row.nomenament || '')}</span>
              <span class="muted">${escapeHtml(row.jornada || '')}</span>
            </div>
          </td>
          <td>
            <div class="cell-stack">
              <span class="muted" title="Generat amb nom + primer cognom, sense accents ni caràcters especials.">${escapeHtml(row.suggestedEmail || '')}</span>
              <input type="email" value="${escapeAttribute(row.selectedEmail || row.suggestedEmail || '')}" aria-label="Correu institucional">
              <button class="secondary" type="button">Comprova</button>
              <div class="row-message"></div>
            </div>
          </td>
          <td>
            <div class="cell-stack">
              <label class="muted" title="Generat amb les dues primeres lletres del primer cognom i el codi del departament.">ID Dinantia</label>
              <input class="dinantia-id" type="text" value="${escapeAttribute(row.suggestedDinantiaId || '')}" aria-label="ID Dinantia">
              <div class="group-picker general-picker">
                <span class="muted">Grups generals</span>
                <input type="text" placeholder="Cerca grups..." aria-label="Grups generals Dinantia">
                <div class="suggestions"></div>
                <div class="chips"></div>
              </div>
              <div class="group-picker teacher-picker">
                <span class="muted">Professor de</span>
                <input type="text" placeholder="Cerca grups de professor..." aria-label="Grups Professor de Dinantia">
                <div class="suggestions"></div>
                <div class="chips"></div>
              </div>
              <div class="group-picker tutor-picker">
                <span class="muted">Tutoria</span>
                <input type="text" placeholder="Cerca grup tutor..." aria-label="Grup tutor Dinantia">
                <div class="suggestions"></div>
                <div class="chips"></div>
              </div>
            </div>
          </td>
          <td>
            <div class="cell-stack">
              ${row.photoUrl ? `<a href="${escapeAttribute(row.photoUrl)}" target="_blank" rel="noopener">Foto</a>` : '<span class="muted">Sense foto</span>'}
              ${row.reductionUrl ? `<a href="${escapeAttribute(row.reductionUrl)}" target="_blank" rel="noopener">Reducció</a>` : ''}
            </div>
          </td>
          <td>
            <div class="cell-stack">
              <span class="pill ${pillClass(row)}">${escapeHtml(row.status || '')}</span>
              <span class="muted">${escapeHtml(row.googleUserStatus || '')}</span>
              <span class="muted">${escapeHtml(row.googleUserUpdatedAt || '')}</span>
              ${row.error ? `<span class="row-message">${escapeHtml(row.error)}</span>` : ''}
            </div>
          </td>
          <td>
            <div class="cell-stack">
              <span class="muted">${row.databaseFound ? 'DNI trobat a Llista' : 'DNI no trobat a Llista'}</span>
              <span class="muted">${row.googleUserExists ? 'Usuari Google existent' : 'Usuari Google no existent'}</span>
            </div>
          </td>
        `;

        const emailInput = tr.querySelector('input[type="email"]');
        const dinantiaIdInput = tr.querySelector('.dinantia-id');
        const checkButton = tr.querySelector('button.secondary');
        const actionCell = tr.lastElementChild.querySelector('.cell-stack');
        const message = tr.querySelector('.row-message');
        const state = {
          generalGroupIds: [...(row.defaultDinantiaGeneralGroupIds || [])],
          teacherGroupIds: [],
          tutorGroupId: ''
        };
        tr._dinantiaState = state;

        setupGroupPicker(tr.querySelector('.general-picker'), state.generalGroupIds, false);
        setupGroupPicker(tr.querySelector('.teacher-picker'), state.teacherGroupIds, false, (ids) => {
          state.teacherGroupIds = ids;
        });
        setupGroupPicker(tr.querySelector('.tutor-picker'), [], true, (ids) => {
          state.tutorGroupId = ids[0] || '';
        });

        checkButton.addEventListener('click', () => checkEmail(row.rowNumber, emailInput.value, message));

        if (row.canRunAction) {
          const actionButton = document.createElement('button');
          actionButton.type = 'button';
          actionButton.textContent = row.actionLabel;
          actionButton.addEventListener('click', () => {
            runAction(row.rowNumber, emailInput.value, {
              dinantiaId: dinantiaIdInput.value,
              generalGroupIds: state.generalGroupIds,
              teacherGroupIds: state.teacherGroupIds,
              tutorGroupId: state.tutorGroupId
            }, actionButton, message);
          });
          actionCell.appendChild(actionButton);
        } else {
          const badge = document.createElement('span');
          badge.className = 'pill error';
          badge.textContent = row.actionLabel;
          actionCell.appendChild(badge);
        }

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'secondary';
        deleteButton.textContent = 'Elimina fila';
        deleteButton.addEventListener('click', () => deleteRow(row.rowNumber, deleteButton, message));
        actionCell.appendChild(deleteButton);

        return tr;
      }

      function setupGroupPicker(container, selectedIds, single, onChange) {
        const input = container.querySelector('input');
        const suggestions = container.querySelector('.suggestions');
        const chips = container.querySelector('.chips');

        renderChips();

        input.addEventListener('input', () => renderSuggestions(input.value));
        input.addEventListener('focus', () => renderSuggestions(input.value));
        document.addEventListener('click', (event) => {
          if (!container.contains(event.target)) suggestions.style.display = 'none';
        });

        function renderSuggestions(query) {
          const q = normalizeSearch(query);
          if (!q) {
            suggestions.style.display = 'none';
            return;
          }

          const matches = dinantiaGroups
            .filter((group) => !selectedIds.includes(group.id))
            .filter((group) => {
              const text = normalizeSearch(`${group.id} ${group.name} ${group.tag}`);
              return text.includes(q);
            })
            .slice(0, 12);

          suggestions.innerHTML = '';
          matches.forEach((group) => {
            const option = document.createElement('div');
            option.className = 'suggestion';
            option.innerHTML = `<strong>${escapeHtml(group.id)}</strong><br><span class="muted">${escapeHtml(group.tag || group.name)}</span>`;
            option.addEventListener('click', () => {
              if (single) {
                selectedIds.splice(0, selectedIds.length, group.id);
              } else {
                selectedIds.push(group.id);
              }

              input.value = '';
              suggestions.style.display = 'none';
              renderChips();
              if (onChange) onChange(selectedIds);
            });
            suggestions.appendChild(option);
          });

          suggestions.style.display = matches.length ? 'block' : 'none';
        }

        function renderChips() {
          chips.innerHTML = '';
          selectedIds.forEach((id) => {
            const group = dinantiaGroups.find((item) => item.id === id) || { id, tag: id };
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.innerHTML = `<span title="${escapeAttribute(group.tag || group.name || id)}">${escapeHtml(id)}</span>`;
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.textContent = 'x';
            remove.setAttribute('aria-label', `Treu ${id}`);
            remove.addEventListener('click', () => {
              const index = selectedIds.indexOf(id);
              if (index >= 0) selectedIds.splice(index, 1);
              renderChips();
              if (onChange) onChange(selectedIds);
            });
            chip.appendChild(remove);
            chips.appendChild(chip);
          });
          if (onChange) onChange(selectedIds);
        }
      }

      function checkEmail(rowNumber, email, messageEl) {
        messageEl.textContent = 'Comprovant correu...';
        google.script.run
          .withSuccessHandler((result) => {
            messageEl.textContent = result.message;
            messageEl.style.color = result.available ? 'var(--success)' : 'var(--danger)';
          })
          .withFailureHandler((error) => {
            messageEl.textContent = error.message || String(error);
            messageEl.style.color = 'var(--danger)';
          })
          .checkEmailAvailability(email, rowNumber);
      }

      function runAction(rowNumber, email, dinantiaOptions, button, messageEl) {
        button.disabled = true;
        messageEl.textContent = 'Executant...';
        messageEl.style.color = 'var(--muted)';

        google.script.run
          .withSuccessHandler((result) => {
            renderResultStatus(messageEl, result);
            setStatus(result.message, result.ok ? 'success' : 'error');
            button.disabled = false;
            if (result.ok) loadRows();
          })
          .withFailureHandler((error) => {
            messageEl.textContent = error.message || String(error);
            messageEl.style.color = 'var(--danger)';
            button.disabled = false;
          })
          .createOrUpdateGoogleUser(rowNumber, email, dinantiaOptions);
      }

      function deleteRow(rowNumber, button, messageEl) {
        if (!confirm('Vols eliminar aquesta fila del full de respostes?')) return;

        button.disabled = true;
        messageEl.textContent = 'Eliminant fila...';
        messageEl.style.color = 'var(--muted)';

        google.script.run
          .withSuccessHandler((result) => {
            messageEl.textContent = result.message;
            messageEl.style.color = result.ok ? 'var(--success)' : 'var(--danger)';
            button.disabled = false;
            loadRows();
          })
          .withFailureHandler((error) => {
            messageEl.textContent = error.message || String(error);
            messageEl.style.color = 'var(--danger)';
            button.disabled = false;
          })
          .deleteFormRow(rowNumber);
      }

      function renderResultStatus(messageEl, result) {
        if (!result.statuses) {
          messageEl.textContent = result.message;
          messageEl.style.color = result.ok ? 'var(--success)' : 'var(--danger)';
          return;
        }

        const lines = [
          result.statuses.google,
          result.statuses.dinantia,
          result.statuses.database
        ];

        messageEl.innerHTML = '<div class="status-lines"></div>';
        const container = messageEl.firstElementChild;
        lines.forEach((line) => {
          const div = document.createElement('div');
          div.className = `status-line ${line && line.ok ? 'ok' : 'error'}`;
          div.textContent = line ? line.message : '';
          container.appendChild(div);
        });
      }

      function pillClass(row) {
        if (row.status === 'Error' || row.googleUserStatus === 'Error') return 'error';
        if (row.status === 'Submitted') return 'warn';
        return '';
      }

      function setStatus(message, kind) {
        statusEl.textContent = message;
        statusEl.className = `status ${kind || ''}`;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttribute(value) {
        return escapeHtml(value);
      }

      function normalizeSearch(value) {
        return String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase();
      }
    </script>
  </body>
</html>
